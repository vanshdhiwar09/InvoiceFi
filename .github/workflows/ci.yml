name: InvoiceFi CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  contract-tests:
    name: Soroban Smart Contract Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (wasm32v1-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Soroban Contract Unit Tests
        run: cargo test --package invoice_contract

      - name: Build Soroban Contract WASM
        run: cargo build --manifest-path=contracts/invoice_contract/Cargo.toml --target=wasm32v1-none --release

      - name: Verify WASM Artifact Existence
        run: |
          if [ -f "target/wasm32v1-none/release/invoice_contract.wasm" ]; then
            echo "WASM artifact verified successfully!"
            ls -lh target/wasm32v1-none/release/invoice_contract.wasm
          else
            echo "Error: WASM artifact target/wasm32v1-none/release/invoice_contract.wasm not found!"
            exit 1
          fi

  backend-tests:
    name: Node.js Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Test Suite
        run: npm test
        working-directory: backend

  frontend-tests:
    name: Next.js Frontend Tests, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Frontend Unit Tests
        run: npm test
        working-directory: frontend

      - name: Run Frontend Linter
        run: npm run lint
        working-directory: frontend

      - name: Run Frontend Production Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_INVOICE_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_INVOICE_CONTRACT_ID || 'CCG2BPR7NEQPV4XOLABSZOWSU24CBJXF4V7LEXIXMAMBPIL6P5CPO2YR' }}
          NEXT_PUBLIC_STELLAR_TOKEN_ADDRESS: ${{ secrets.NEXT_PUBLIC_STELLAR_TOKEN_ADDRESS || 'CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC' }}
          NEXT_PUBLIC_STELLAR_RPC_URL: ${{ secrets.NEXT_PUBLIC_STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
